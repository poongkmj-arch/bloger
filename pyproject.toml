[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blog-workbench"
version = "0.2.0"
description = "Offline Korean blog draft and review pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2", "openai>=2,<3"]

[project.scripts]
blog-mvp = "blog_mvp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
