name: Free AI offline tests
on:
  pull_request:
    paths:
      - 'cloud_free_writer.py'
      - 'tests/test_cloud_free_writer.py'
      - '.github/workflows/free-ai-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unit tests (no API keys)
        run: python -m unittest discover -s tests -p 'test_cloud_free_writer.py' -v
