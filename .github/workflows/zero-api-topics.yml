name: Zero API topic collection
on:
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect RSS topic candidates (no paid API)
        env:
          BLOG_RSS_URLS: ${{ vars.BLOG_RSS_URLS }}
        run: python automation_stage1.py --output output/stage1
      - uses: actions/upload-artifact@v4
        with:
          name: topic-candidates
          path: output/stage1/
          retention-days: 7
