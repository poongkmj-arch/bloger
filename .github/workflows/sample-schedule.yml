name: Offline sample validation
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"
permissions:
  contents: read
concurrency:
  group: offline-sample-validation
  cancel-in-progress: false
jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SAMPLE_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Validate only; no production data on runner
        run: blog-mvp import-csv samples/keywords.csv --dry-run
